# ============================================================
#  INSTAGRAM AJAN SİSTEMİ - AYARLAR
#  Sadece bu dosyayı düzenleyerek sistemi kendi hesabına uyarla.
# ============================================================

hesap:
  kullanici_adi: "gercek.maliyet"        # @ olmadan
  gorunen_ad: "Gerçek maliyet | Rakamlarla"
  biyografi: "Ne kadara mal oluyor? 💸 Gerçek rakamlar, kaynaklı tablolar 📊 Araba, ev, iş kurmak, abonelikler… A vs B karşılaştırmaları"
  nis: "gerçek maliyet ve karşılaştırma analizleri: bir şeyin cebe gerçekte kaça mal olduğunu güncel Türkiye fiyatlarıyla, kalem kalem ve kaynaklı gösteren içerikler (araba sahibi olmanın yıllık maliyeti, X TL ile iş kurmak, kira vs kredi, abonelik ve teknoloji karşılaştırmaları, şehirlerde yaşam maliyeti)"
  hedef_kitle: "22-40 yaş, Türkiye'de yaşayan, karar vermeden önce rakam görmek isteyen çalışanlar, yeni iş kurmak isteyenler, araba/ev almayı düşünenler"
  dil: "Türkçe"
  ton: "net, meraklı, tarafsız; rakamla konuşur, abartmaz; 'sen' diye hitap; kısa cümleler; emoji sadece 💸📊 gibi az ve yerinde"
  marka_kurallari:
    - "Her rakamın bir kaynağı olmalı; kaynağı olmayan rakamı yazma. Tahmin ise açıkça 'tahmini' de ve varsayımı belirt."
    - "Fiyatların tarihini belirt (ör. 'Kasım 2026 fiyatlarıyla'); enflasyon nedeniyle eskiyebileceğini hatırlat."
    - "Kesin yatırım/finans tavsiyesi verme; 'şunu al' deme, karşılaştırmayı göster, kararı izleyiciye bırak."
    - "Marka kötülemesi yok: karşılaştırmalar adil ve aynı koşullarda yapılsın."
    - "Toplamları ve hesapları doğru yap; ara toplamlar tabloyla birebir tutsun."

# Araştırmacının inceleyeceği büyük sayfalar.
# Boş bırakılırsa araştırmacı nişteki büyük sayfaları web'de KENDİSİ bulur,
# Instagram API ile doğrular ve haftada bir listeyi yeniler (data/pages.json).
buyuk_sayfalar: []
otomatik_sayfa_bulma: true

# İncelenecek hashtag'ler (Instagram kuralı: haftada en fazla 30 farklı hashtag aranabilir)
hashtagler:
  - "maliyet"
  - "kişiselfinans"
  - "ekonomi"
  - "otomobil"
  - "girişimcilik"

seri:
  # Her videoda AYNI kimlik: izleyicinin aklında kalması için değiştirme.
  ad: "GERÇEK MALİYET"
  acilis: "Bunun gerçek maliyetini hesapladık."          # her videonun ilk cümlesi
  kapanis_ses: "Hangisini hesaplayalım? Yorumlara yaz, seçtiğini biz hesaplayalım."
  kapanis: "Hangisini hesaplayalım? Yorumlara yaz"        # son sahnedeki imza yazısı

# 1) "Kaç gün çalışman gerekir?" çevirisi: her büyük rakam asgari ücretle kaç günlük emek?
#    Asgari ücret değişince (genelde Ocak / Temmuz) SADECE bu iki satırı güncelle.
maas_cevirisi:
  asgari_ucret_net: 28075.50     # aylık net asgari ücret (TL)
  kaynak: "2026 asgari ücreti, Resmî Gazete 26.12.2025"
  aylik_calisma_gunu: 30
  aylik_calisma_saati: 225

# 5) Haftalık sabit günler: her gün 1 video (18:30) günün alt serisinden olur
haftalik_program:
  Pazartesi: "ZAM TAKİBİ"
  Salı: "GİZLİ MASRAFLAR"
  Çarşamba: "A MI B Mİ?"
  Perşembe: "ŞEHİR ŞEHİR"
  Cuma: "X TL İLE NE YAPILIR?"
  Cumartesi: "İZLEYİCİ SORUSU"
  Pazar: "HAFTANIN GERÇEK MALİYETİ"

# 2) Zam alarmı: gündem günde 3 kez taranır; büyük bir zam/fiyat haberi düşerse
#    1-2 saat içinde ekstra "SON DAKİKA" videosu üretilir (günde en fazla 1).
zam_alarmi:
  aktif: true
  gunluk_en_fazla: 1
  yayin_gecikmesi_dk: 75        # üretimden kaç dakika sonra paylaşılsın

# 6) Hesaplayıcı site (GitHub Pages): her videonun etkileşimli hesaplayıcısı
site:
  aktif: true
  adres: "https://gazi1453-byndr.github.io/insta-ajanlar/"
  # Satış ortaklığı linkleri: bir programa katılınca buraya ekle (boşsa gösterilmez)
  ortaklik_linkleri: {}
  # ör. kasko: {metin: "Kasko tekliflerini karşılaştır", url: "https://..."}

uretim:
  gunluk_gonderi: 3            # Günde 3 video
  paylasim_saatleri: ["12:30", "18:30", "21:30"]  # Türkiye saati (öğle, iş çıkışı, akşam)
  format_orani:                # Fikir ajanı bu dağılıma göre format seçer
    reel: 1.0                  # Hepsi video
    carousel: 0.0
  carousel_slayt_sayisi: 7
  video_suresi_sn: 40          # hedef; yüksek tempo
  video_sure_araligi: [35, 42]  # Senkron Kontrolcüsü bu aralığın dışını geri çevirir
  sahne_en_uzun_sn: 4.0        # hiçbir ara sahne 4 sn'den uzun kalmaz
  revizyon_hakki: 3            # Kontrollerden geçemeyen içerik en fazla kaç kez düzeltilsin
  onay_esigi: 80               # Müdürün eşiği (100 üzerinden)
  bas_mudur_esigi: 85          # Baş Müdürün eşiği (daha yüksek, veto yetkili)
  insan_onayi: false           # true: onaylanan içerik önce sana Pull Request olarak gelir,
                               #       sen "Merge" deyince yayın kuyruğuna girer.

topluluk:
  yorum_yaniti: true           # Yorumlara otomatik yanıt
  dm_yaniti: false             # DM için Meta uygulama incelemesi gerekir (README'ye bak)
  yanitlanmayacak_konular:
    - "şikayet, hukuki konular, sponsorluk/reklam teklifleri -> yanıtlama, raporla"
    - "kişiye özel yatırım tavsiyesi isteyen sorular -> genel bilgi ver, tavsiye verme"

gorsel:
  # 60-30-10 renk kuralı (Renk Denetçisi her videoda ölçer)
  arka_plan: "#0B1220"         # %60 baskın: gece laciverti (güven, ciddiyet)
  panel: "#18233A"             # %30 ikincil: arduvaz kart (içerik alanı)
  vurgu: "#22C55E"             # %10 vurgu: para yeşili (rakamlar, rozet, çubuklar)
  uyari: "#F43F5E"             # nadiren: olumsuz/pahalı vurgusu
  yazi: "#F8FAFC"
  yazi_ikincil: "#94A3B8"
  boyut: [1080, 1350]          # Carousel: Instagram 4:5 dikey
  video_boyut: [1080, 1920]    # Reels: 9:16

ses:
  saglayici: "edge"            # edge (ücretsiz Microsoft nöral ses) | yok
  edge_ses: "tr-TR-AhmetNeural"  # alternatif: tr-TR-EmelNeural (kadın)
  hiz: "+18%"                  # enerjik tempo; baş/son sessizlikler ayrıca kırpılır

yapay_zeka:
  # KURAL: soldan sağa denenir. Gemini'nin günlük limiti dolarsa ya da hata verirse
  # sistem durmaz, otomatik olarak Groq'a geçer. (İkisi de ücretsiz katman.)
  # İsteğe bağlı ek sağlayıcılar: "claude_abonelik", "claude_api"
  sira: ["gemini", "groq"]
  # Model listeleri: ilk model kapanmış/bulunamamışsa sıradaki denenir.
  gemini_model: ["gemini-flash-latest", "gemini-flash-lite-latest", "gemini-2.5-flash", "gemini-2.5-flash-lite"]
  groq_model: ["openai/gpt-oss-120b", "llama-3.3-70b-versatile"]
  groq_gorsel_model: ["meta-llama/llama-4-scout-17b-16e-instruct"]
  groq_arastirma_model: ["groq/compound", "groq/compound-mini"]
