# ============================================================
#  INSTAGRAM AJAN SİSTEMİ - AYARLAR
#  Sadece bu dosyayı düzenleyerek sistemi kendi hesabına uyarla.
# ============================================================

hesap:
  kullanici_adi: "yapayzeka.pratik"      # @ olmadan. Alınmışsa: yapayzekapratik / pratik.yapayzeka
  gorunen_ad: "Yapay Zeka Pratik | AI İpuçları"
  biyografi: "Yapay zekayı işinde ve hayatında kullanmanın en kolay yolları 🤖 Her gün 1 pratik araç & ipucu 📌 Kaydet, sonra dene"
  nis: "yapay zeka araçlarını iş, okul ve günlük hayatta pratik şekilde kullanmak (ChatGPT, Claude, Gemini, görsel ve video yapay zeka araçları, hazır promptlar, verimlilik)"
  hedef_kitle: "18-40 yaş, Türkiye'de yaşayan öğrenciler, çalışanlar, serbest çalışanlar ve küçük işletme sahipleri; yapay zekayı duymuş ama verimli kullanamayan kişiler"
  dil: "Türkçe"
  ton: "samimi, enerjik ve net; teknik jargon yok, varsa tek cümleyle açıklanır; okura 'sen' diye hitap; emoji az ve yerinde"
  marka_kurallari:
    - "Var olmayan araç, özellik ya da fiyat uydurma; emin olmadığın bilgiyi yazma, araştırma raporunda geçen ya da çok bilinen araçları kullan."
    - "Ücretli araçları 'ücretli' ya da 'ücretsiz sürümü var' diye belirt."
    - "Abartılı vaat yok: 'para basan prompt', 'işini elinden alacak' gibi korku/tık tuzağı dili kullanma."
    - "Her gönderi tek bir net, hemen denenebilir fikir anlatsın; mümkünse kopyalanabilir bir prompt örneği ver."
    - "Kişisel veri, sağlık ve hukuk konularında yapay zekaya körü körüne güvenmemeyi hatırlat."

# Araştırmacının inceleyeceği büyük sayfalar.
# Boş bırakılırsa araştırmacı nişteki büyük sayfaları web'de KENDİSİ bulur,
# Instagram API ile doğrular ve haftada bir listeyi yeniler (data/pages.json).
buyuk_sayfalar: []
otomatik_sayfa_bulma: true

# İncelenecek hashtag'ler (Instagram kuralı: haftada en fazla 30 farklı hashtag aranabilir)
hashtagler:
  - "yapayzeka"
  - "chatgpt"
  - "yapayzekaaraçları"
  - "verimlilik"
  - "dijitalpazarlama"

uretim:
  gunluk_gonderi: 1            # Yeni hesap: ilk 2 hafta günde 1, sonra 2'ye çıkarılabilir
  paylasim_saatleri: ["20:00"] # Türkiye saati; analist en iyi saatleri raporlar
  carousel_slayt_sayisi: 6
  revizyon_hakki: 2            # Müdür beğenmezse içerik kaç kez yeniden yazılsın
  onay_esigi: 75               # Müdürün 100 üzerinden vermesi gereken en düşük puan
  insan_onayi: false           # true: onaylanan içerik önce sana Pull Request olarak gelir,
                               #       sen "Merge" deyince yayın kuyruğuna girer.

topluluk:
  yorum_yaniti: true           # Yorumlara otomatik yanıt
  dm_yaniti: false             # DM için Meta uygulama incelemesi gerekir (README'ye bak)
  yanitlanmayacak_konular:
    - "şikayet, hukuki konular, iş/reklam teklifleri -> yanıtlama, raporla"

gorsel:
  # Şablon görsellerin renkleri (carousel slaytları için)
  arka_plan: "#0B1020"         # gece mavisi
  vurgu: "#3DDCFF"             # elektrik mavisi
  yazi: "#F5F7FF"
  boyut: [1080, 1350]          # Instagram 4:5 dikey

modeller:
  # Varsayılan: Claude Opus 5.5. Maliyeti düşürmek istersen sadece burayı değiştir.
  varsayilan: "claude-opus-5-5"
  topluluk: "claude-opus-5-5"
