# ============================================================
#  INSTAGRAM AJAN SİSTEMİ - AYARLAR
#  Sadece bu dosyayı düzenleyerek sistemi kendi hesabına uyarla.
# ============================================================

hesap:
  kullanici_adi: "gercek.maliyet"        # @ olmadan
  gorunen_ad: "Gerçek maliyet | Rakamlarla"
  biyografi: "Ne kadara mal oluyor? 💸 Gerçek rakamlar, kaynaklı tablolar 📊 Araba, ev, iş kurmak, abonelikler… A vs B karşılaştırmaları"
  nis: "gerçek maliyet ve karşılaştırma analizleri: bir şeyin cebe gerçekte kaça mal olduğunu güncel Türkiye fiyatlarıyla, kalem kalem ve kaynaklı gösteren içerikler (araba sahibi olmanın yıllık maliyeti, X TL ile iş kurmak, kira vs kredi, abonelik ve teknoloji karşılaştırmaları, şehirlerde yaşam maliyeti)"
  hedef_kitle: "22-40 yaş, Türkiye'de yaşayan, karar vermeden önce rakam görmek isteyen çalışanlar, yeni iş kurmak isteyenler, araba/ev almayı düşünenler"
  dil: "Türkçe"
  ton: "net, meraklı, tarafsız; rakamla konuşur, abartmaz; 'sen' diye hitap; kısa cümleler; emoji sadece 💸📊 gibi az ve yerinde"
  marka_kurallari:
    - "Her rakamın bir kaynağı olmalı; kaynağı olmayan rakamı yazma. Tahmin ise açıkça 'tahmini' de ve varsayımı belirt."
    - "Fiyatların tarihini belirt (ör. 'Kasım 2026 fiyatlarıyla'); enflasyon nedeniyle eskiyebileceğini hatırlat."
    - "Kesin yatırım/finans tavsiyesi verme; 'şunu al' deme, karşılaştırmayı göster, kararı izleyiciye bırak."
    - "Marka kötülemesi yok: karşılaştırmalar adil ve aynı koşullarda yapılsın."
    - "Toplamları ve hesapları doğru yap; ara toplamlar tabloyla birebir tutsun."

# Araştırmacının inceleyeceği büyük sayfalar.
# Boş bırakılırsa araştırmacı nişteki büyük sayfaları web'de KENDİSİ bulur,
# Instagram API ile doğrular ve haftada bir listeyi yeniler (data/pages.json).
buyuk_sayfalar: []
otomatik_sayfa_bulma: true

# İncelenecek hashtag'ler (Instagram kuralı: haftada en fazla 30 farklı hashtag aranabilir)
hashtagler:
  - "maliyet"
  - "kişiselfinans"
  - "ekonomi"
  - "otomobil"
  - "girişimcilik"

uretim:
  gunluk_gonderi: 1            # Yeni hesap: ilk 2 hafta günde 1, sonra 2'ye çıkarılabilir
  paylasim_saatleri: ["20:00"] # Türkiye saati; analist en iyi saatleri raporlar
  format_orani:                # Fikir ajanı bu dağılıma göre format seçer
    reel: 0.7                  # 45 sn dikey video (slaytlardan otomatik üretilir)
    carousel: 0.3              # Kaydırmalı maliyet tablosu
  carousel_slayt_sayisi: 7
  video_suresi_sn: 45
  revizyon_hakki: 2            # Müdür beğenmezse içerik kaç kez yeniden yazılsın
  onay_esigi: 75               # Müdürün 100 üzerinden vermesi gereken en düşük puan
  insan_onayi: false           # true: onaylanan içerik önce sana Pull Request olarak gelir,
                               #       sen "Merge" deyince yayın kuyruğuna girer.

topluluk:
  yorum_yaniti: true           # Yorumlara otomatik yanıt
  dm_yaniti: false             # DM için Meta uygulama incelemesi gerekir (README'ye bak)
  yanitlanmayacak_konular:
    - "şikayet, hukuki konular, sponsorluk/reklam teklifleri -> yanıtlama, raporla"
    - "kişiye özel yatırım tavsiyesi isteyen sorular -> genel bilgi ver, tavsiye verme"

gorsel:
  arka_plan: "#0E1116"         # koyu antrasit
  vurgu: "#22C55E"             # para yeşili
  uyari: "#F43F5E"             # pahalı/olumsuz kalemler için kırmızı
  yazi: "#F8FAFC"
  boyut: [1080, 1350]          # Carousel: Instagram 4:5 dikey
  video_boyut: [1080, 1920]    # Reels: 9:16

yapay_zeka:
  # KURAL: soldan sağa denenir. Gemini'nin günlük limiti dolarsa ya da hata verirse
  # sistem durmaz, otomatik olarak Groq'a geçer. (İkisi de ücretsiz katman.)
  # İsteğe bağlı ek sağlayıcılar: "claude_abonelik", "claude_api"
  sira: ["gemini", "groq"]
  # Model listeleri: ilk model kapanmış/bulunamamışsa sıradaki denenir.
  gemini_model: ["gemini-flash-latest", "gemini-2.5-flash"]
  groq_model: ["openai/gpt-oss-120b", "llama-3.3-70b-versatile"]
  groq_gorsel_model: ["meta-llama/llama-4-scout-17b-16e-instruct"]
  groq_arastirma_model: ["groq/compound", "groq/compound-mini"]
