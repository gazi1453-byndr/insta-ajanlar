# Ortak çalıştırıcı: diğer tüm workflow'lar bunu çağırır.
# Ajanı çalıştırır, ürettiği veriyi (data/, media/) repoya geri kaydeder.
name: _ajan

on:
  workflow_call:
    inputs:
      komut:
        required: true
        type: string
      dry_run:
        required: false
        type: boolean
        default: false
      onay_pr:
        description: "config.yaml'da insan_onayi: true ise sonucu Pull Request olarak aç"
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    # Aynı anda tek ajan çalışsın; veri dosyaları çakışmasın.
    concurrency:
      group: insta-ajanlar
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # Video motoru (Remotion) — yalnızca video üreten komutlarda
      - uses: actions/setup-node@v4
        if: contains(fromJSON('["uret","yeniden_ciz","onizleme","gundem","arastir"]'), inputs.komut)
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: video/package-lock.json
      - name: Remotion kur
        if: contains(fromJSON('["uret","yeniden_ciz","onizleme","gundem","arastir"]'), inputs.komut)
        working-directory: video
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq libnss3 libdbus-1-3 libatk1.0-0 libgbm1 \
            libxrandr2 libxkbcommon0 libxfixes3 libxcomposite1 libxdamage1 libatk-bridge2.0-0 libpango-1.0-0 \
            libcairo2 libcups2 > /dev/null || true
          npm ci --no-audit --no-fund
          npx remotion browser ensure

      - name: Claude Code kur (sadece claude_abonelik kullanılıyorsa)
        env:
          TOK: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: if [ -n "$TOK" ]; then npm install -g @anthropic-ai/claude-code; fi

      - name: Ajanı çalıştır (${{ inputs.komut }})
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_VOICE_ID: ${{ secrets.ELEVENLABS_VOICE_ID }}
          GRAPH_API_VERSION: ${{ vars.GRAPH_API_VERSION }}
          MEDIA_BASE_URL: ${{ vars.MEDIA_BASE_URL }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
        run: python pipeline.py ${{ inputs.komut }}

      - name: TikTok / YouTube paylaşım paketlerini bildir
        if: ${{ !inputs.dry_run && inputs.komut == 'yayinla' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p data/crosspost/done
          for f in data/crosspost/pending/*.md; do
            [ -e "$f" ] || continue
            title=$(head -1 "$f" | sed 's/^# //')
            tail -n +3 "$f" > /tmp/body.md
            gh issue create --title "📤 TikTok + YouTube'a paylaş: $title" --body-file /tmp/body.md
            git mv -f "$f" data/crosspost/done/ 2>/dev/null || mv "$f" data/crosspost/done/
          done

      - name: Sonuçları kaydet
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "insta-ajan"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python pipeline.py plan || echo "program sayfası üretilemedi"
          git add data media hesap index.html plan.html 2>/dev/null || git add data media
          if git diff --cached --quiet; then echo "Değişiklik yok"; exit 0; fi

          HUMAN=$(python -c "import yaml;print(str(yaml.safe_load(open('config.yaml',encoding='utf-8'))['uretim'].get('insan_onayi',False)).lower())")
          if [ "${{ inputs.onay_pr }}" = "true" ] && [ "$HUMAN" = "true" ]; then
            BR="onay/$(date +%Y%m%d-%H%M)"
            git switch -c "$BR"
            git commit -m "Onay bekleyen içerikler ($(date +%d.%m.%Y))"
            git push -u origin "$BR"
            gh pr create --base "${{ github.ref_name }}" --head "$BR" \
              --title "📝 Onay bekleyen içerikler - $(date +%d.%m.%Y)" \
              --body "Müdür ajanın onayladığı içerikler. Görselleri **Files changed** sekmesinde görebilirsin. **Merge** = yayın kuyruğuna al, **Close** = iptal."
          else
            git commit -m "ajan: ${{ inputs.komut }} ($(date +%d.%m.%Y\ %H:%M))"
            git pull --rebase
            git push
          fi
